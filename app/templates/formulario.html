<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar Turno - Capricho Barber</title>
    <!-- Enlace al CSS compilado de Tailwind -->
    <link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 font-sans text-gray-900">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <!-- Encabezado -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Capricho Barber</h1>
            <p class="text-gray-500 mt-2">Reserva tu turno online</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    {% if category == 'error' %}
                        <div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-6 rounded">
                            <p>{{ message }}</p>
                        </div>
                    {% endif %}
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('reservas.index') }}" method="POST" class="space-y-5">
            
            <div>
                <label for="cliente_nombre" class="block text-sm font-medium text-gray-700 mb-1">Nombre Completo</label>
                <input type="text" id="cliente_nombre" name="cliente_nombre" required 
                       class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                       placeholder="Ej: Juan Pérez">
            </div>

            <div>
                <label for="telefono" class="block text-sm font-medium text-gray-700 mb-1">Teléfono (WhatsApp)</label>
                <input type="tel" id="telefono" name="telefono" required 
                       class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                       placeholder="Ej: 11 1234-5678">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <!-- Campo: Fecha -->
                <div>
                    <label for="fecha_reserva" class="block text-sm font-medium text-gray-700 mb-1">Fecha</label>
                    <input type="date" id="fecha_reserva" name="fecha_reserva" required 
                           class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors">
                </div>

                <div>
                    <label for="hora_reserva" class="block text-sm font-medium text-gray-700 mb-1">Hora</label>
                    <input type="time" id="hora_reserva" name="hora_reserva" required 
                           class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors">
                </div>
            </div>
            <div>
                <label for="servicio" class="block text-sm font-medium text-gray-700 mb-1">Servicio</label>
                <select id="servicio" name="servicio" required 
                        class="w-full border border-gray-300 rounded-lg px-4 py-2.5 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors">
                    <option value="" disabled selected>Selecciona un servicio...</option>
                    <option value="Corte Clásico">Corte Clásico</option>
                    <option value="Corte + Barba">Corte + Barba</option>
                    <option value="Solo Barba">Solo Barba</option>
                    <option value="Corte Niño">Corte Niño (Menor de 12)</option>
                    <option value="Colorimetría / Platinado">Colorimetría / Platinado</option>
                </select>
            </div>

            <div>
                <label for="barbero" class="block text-sm font-medium text-gray-700 mb-1">Barbero de preferencia</label>
                <select id="barbero" name="barbero" required 
                        class="w-full border border-gray-300 rounded-lg px-4 py-2.5 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors">
                    <option value="" disabled selected>Selecciona un barbero...</option>
                    <option value="Nacho">Nacho</option>
                    <option value="Luciano">Luciano</option>
                    <option value="Cualquiera">Cualquiera / Sin preferencia</option>
                </select>
            </div>

            <div class="pt-2">
                <button type="submit" 
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors duration-200 shadow-md">
                    Confirmar Reserva
                </button>
            </div>

        </form>
    </div>

</body>
</html>

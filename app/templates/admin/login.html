<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Admin - Capricho Barber</title>
    <link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet">
    <link rel="icon" type="image/svg" href="{{ url_for('static', filename='svg/CAPRICHO.svg') }}">
</head>
<body class="bg-zinc-950 min-h-screen flex items-center justify-center p-4 font-sans text-zinc-100 selection:bg-white selection:text-black">
    
    <div class="bg-zinc-900 p-8 rounded-2xl shadow-2xl border border-zinc-800 w-full max-w-sm text-center">
        
        <div class="flex flex-col items-center mb-8">
            <img src="{{ url_for('static', filename='svg/CAPRICHO.svg') }}" alt="Logo Admin" class="w-16 h-16 object-contain mb-4 drop-shadow-[0_0_15px_rgba(255,255,255,0.1)]">
            <h1 class="text-2xl font-extrabold text-white tracking-wide uppercase">Acceso Restringido</h1>
        </div>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="bg-red-950/50 border border-red-900 text-red-400 p-4 mb-6 rounded-lg text-sm">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('admin.login') }}" method="POST" class="space-y-6">
            <div>
                <input type="password" name="password" required placeholder="Contraseña de administrador"
                       class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-3 text-white placeholder-zinc-600 focus:outline-none focus:ring-1 focus:ring-white focus:border-white transition-colors text-center tracking-widest">
            </div>
            
            <button type="submit" class="w-full bg-white hover:bg-zinc-200 text-black font-bold uppercase tracking-widest text-sm py-4 rounded-lg transition-all shadow-[0_0_15px_rgba(255,255,255,0.1)] hover:shadow-[0_0_20px_rgba(255,255,255,0.2)]">
                Ingresar al Panel
            </button>
        </form>
    </div>

</body>
</html>
